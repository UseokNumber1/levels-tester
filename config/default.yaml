app:
  environment: development
  host: 127.0.0.1
  port: 8080

replay:
  primary_timeframe: 1h
  detail_timeframes:
    - 1m
    - 5m
  default_speed: 1.0
  only_closed_candles: true
  intrabar_policy: m5_exact
  checkpoint_every_bars: 50

algorithm:
  version: "1.0.0"
  pivot:
    wing: 8
    equal_extrema: first
    min_volume_ratio: 0.5
  level:
    zone_percent: 0.008
    breakout: wick
    min_bounce_percent: 0.045
    min_touches: 2
    max_lifetime_bars: null
    tick_size: 0.01
  confirmation:
    method: bounce
    methods:
      - bounce
    timeframe: 1m
    required_bars: 2
    max_wait_bars: 15
    entry_on_next_bar: true
  execution:
    stop_buffer_percent: 0.002
    risk_reward: 2
    fee_percent: 0
    slippage_percent: 0
    variants:
      - id: sl_02_rr_2
        name: SL 0.2% / RR 2
        stop:
          type: percent_from_entry
          value: 0.2
        take:
          type: risk_reward
          value: 2
      - id: sl_03_rr_2
        name: SL 0.3% / RR 2
        stop:
          type: percent_from_entry
          value: 0.3
        take:
          type: risk_reward
          value: 2
      - id: sl_05_tp_1
        name: SL 0.5% / TP 1%
        stop:
          type: percent_from_entry
          value: 0.5
        take:
          type: percent_from_entry
          value: 1.0
  outcomes:
    - name: quick_rebound
      wait_bars: 3
      min_bounce_percent: 0.001
    - name: patient_rebound
      wait_bars: 8
      min_bounce_percent: 0.001

market:
  exchange: binance
  market_type: usdt_m_futures
  quote_asset: USDT

hourbounce:
  # Сетка Grid+БУ для PnL-отчёта: перевод стопа в безубыток по триггеру,
  # трейлинг 1%/1% включается строго после БУ (порядок как в проде PGv2).
  # Требуется перезапуск сервера после правок.
  grid_be_trigger_pct: 0.9
  grid_be_lock_pct: 0.35
  # Комиссии Binance USDT-M Futures (VIP0/Regular, пользовательские %: 0.02 = 0.02%).
  # maker — лимитные заявки (вход T1L, выход TP); taker — маркет/стоп (вход T1M/T2/T3, выход SL/trail).
  # Скидка 10% за оплату BNB не применяется. Требуется перезапуск сервера после правок.
  maker_fee_percent: 0.02
  taker_fee_percent: 0.05
