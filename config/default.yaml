app:
  environment: development
  host: 127.0.0.1
  port: 8080

replay:
  primary_timeframe: 1h
  detail_timeframes:
    - 1m
    - 5m
  default_speed: 10.0
  only_closed_candles: true
  intrabar_policy: m5_exact
  checkpoint_every_bars: 50

algorithm:
  version: "1.0.0"
  pivot:
    wing: 6
    equal_extrema: first
    min_volume_ratio: 0.5
  level:
    zone_percent: 0.008
    breakout: wick
    min_bounce_percent: 0.045
    min_touches: 2
    max_lifetime_bars: null
    tick_size: 0.01
  confirmation:
    timeframe: 1m
    required_bars: 2
    max_wait_bars: 15
    entry_on_next_bar: true
  execution:
    stop_buffer_percent: 0.002
    risk_reward: 2
    fee_percent: 0
    slippage_percent: 0
  outcomes:
    - name: quick_rebound
      wait_bars: 3
      min_bounce_percent: 0.001
    - name: patient_rebound
      wait_bars: 8
      min_bounce_percent: 0.001

market:
  exchange: binance
  market_type: usdt_m_futures
  quote_asset: USDT
