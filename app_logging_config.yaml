version: 1
disable_existing_loggers: false
formatters:
  default:
    format: '%(asctime)s  %(levelname)-8s  %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: default
    filename: logs/app.log
    encoding: utf-8
    mode: a
loggers:
  uvicorn:
    handlers: [console, file]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [console, file]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [console]
    level: INFO
    propagate: false
  __main__:
    handlers: [console, file]
    level: INFO
    propagate: false
  scanner:
    handlers: [console, file]
    level: INFO
    propagate: false
root:
  handlers: [console, file]
  level: INFO
