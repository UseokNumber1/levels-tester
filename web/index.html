<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Levels Tester v0.4.0</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">HISTORICAL REPLAY / BINANCE USDT-M</span><h1>Levels Tester <span class="version">v0.4.0</span></h1></div>
    <div class="server-status"><span id="server-dot" class="dot pending"></span><span id="server-status">CHECKING SERVER</span><div id="run-status" class="status">NO RUN</div></div>
  </header>
  <main class="shell">
    <section class="control-panel">
      <label>Symbol<select id="symbol"><option>Loading instruments...</option></select></label>
      <label>Display from<input id="display-from" type="date"></label>
      <label>Speed<input id="speed" type="number" min="0.1" max="100" step="0.1" value="1"></label>
      <button id="create" class="primary">New replay</button>
      <span class="panel-divider"></span>
      <label>Search<input id="instrument-search" placeholder="BTC, ETH..."></label>
      <label>Min 24h volume<input id="min-volume" type="number" min="0" step="1000000" placeholder="0"></label>
      <button id="refresh-instruments">Refresh</button>
      <span id="instrument-info">Loading symbols from Binance...</span>
    </section>
    <section id="loading-bar" class="loading-bar hidden">
      <div class="loading-progress"><div id="loading-fill" class="loading-fill" style="width: 0%"></div></div>
      <div class="loading-text"><span id="loading-stage">Preparing...</span><span id="loading-percent">0%</span></div>
    </section>
    <section class="toolbar">
      <button data-command="play">Play</button><button data-command="pause">Pause</button>
      <button data-command="step">Step</button><button data-command="reset">Reset</button>
      <span id="replay-hint" class="replay-hint"></span>
      <div class="cursor-readout">Cursor <strong id="cursor">not started</strong></div>
      <div class="replay-progress"><div class="replay-progress-track"><div id="replay-fill" class="replay-progress-fill"></div></div><span id="replay-text" class="replay-progress-text">0 / 0</span></div>
    </section>
    <section class="grid">
      <article class="card chart-card"><div class="card-head"><h2>H1 market</h2><span id="bar-count">0 bars</span></div><div id="chart"></div></article>
      <article class="card detail-chart-card"><div class="card-head"><h2>Detail M1</h2><span id="detail-status">waiting for touch</span></div><div id="detail-chart" class="detail-waiting">Chart opens on level touch.</div></article>
      <aside class="card levels-panel"><div class="card-head"><h2>Active levels</h2><span id="level-count">0</span></div><div id="levels" class="level-list empty">Create a replay to inspect levels.</div></aside>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
